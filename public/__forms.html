<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Forms</title></head>
  <body>
    <form name="driveline-quote" method="post" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="driveline-quote">
      <input type="hidden" name="subject" value="New driveline quote enquiry">
      <input type="text" name="bot-field">
      <input type="text" name="name">
      <input type="text" name="company">
      <input type="tel" name="phone">
      <input type="text" name="truck-model">
      <textarea name="gearbox-problem"></textarea>
      <input type="file" name="image-1">
      <input type="file" name="image-2">
      <input type="file" name="image-3">
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
